<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartCampus — Connexion</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page-connexion">
    <section class="carte" aria-labelledby="titre">
      <h1 id="titre" class="titre-app">SmartCampus</h1>
      <form id="form-connexion" novalidate>
        <div class="champ">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="username" required />
        </div>
        <div class="champ">
          <label for="motDePasse">Mot de passe</label>
          <input type="password" id="motDePasse" name="motDePasse" autocomplete="current-password" required />
        </div>
        <button type="submit" class="bouton">Se connecter</button>
        <p id="erreur" class="message-erreur" role="alert"></p>
      </form>
      <p class="indice">
        Comptes de démo (mot de passe <strong>demo1234</strong>) :<br />
        lea@campus.fr · karim@campus.fr · sophie@campus.fr
      </p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/connexion.js"></script>
</body>
</html>
